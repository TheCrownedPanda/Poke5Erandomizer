<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Poke Generator</title>
<meta name="theme-color" content="#14162B">
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: #0D0E1C;
    font-family: 'Nunito', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  body {
    min-height: 100vh;
    padding: 24px 16px;
  }
  button, input:not([type="checkbox"]):not([type="radio"]) {
    font-family: inherit;
    -webkit-appearance: none;
    -moz-appearance: none;
    appearance: none;
  }
</style>
</head>
<body>
<div id="app">
  <div class="header">
    <div class="ball-icon" aria-hidden="true">
      <svg viewBox="0 0 100 100" width="44" height="44">
        <circle cx="50" cy="50" r="46" fill="#F4F4F0" stroke="#1A1A2E" stroke-width="4"/>
        <path d="M4 50 A46 46 0 0 1 96 50" fill="#EE1515" stroke="#1A1A2E" stroke-width="4"/>
        <line x1="4" y1="50" x2="96" y2="50" stroke="#1A1A2E" stroke-width="4"/>
        <circle cx="50" cy="50" r="14" fill="#F4F4F0" stroke="#1A1A2E" stroke-width="4"/>
        <circle cx="50" cy="50" r="6" fill="#1A1A2E"/>
      </svg>
    </div>
    <div class="header-text">
      <h1>Poke Generator</h1>
      <p>Pick a spawn-rate tier, choose how many, pull.</p>
    </div>
  </div>

  <div class="layout">
    <div class="panel">
      <div class="panel-block">
        <div class="panel-label">Spawn rate tier<span class="panel-hint">blank = all tiers</span></div>
        <div id="srGrid" class="sr-grid"></div>
      </div>

      <div class="panel-block">
        <div class="panel-label">Type<span class="panel-hint">blank = all types</span></div>
        <div id="typeGrid" class="type-grid"></div>
      </div>

      <div class="panel-block">
        <div class="panel-label">Category<span class="panel-hint">blank = all categories</span></div>
        <div id="catGrid" class="cat-grid"></div>
      </div>

      <div class="panel-block">
        <div class="panel-label">How many to pull</div>
        <div class="qty-row">
          <button class="qty-btn" id="qtyDown" aria-label="Decrease">&minus;</button>
          <input type="number" id="qtyInput" value="3" min="1" />
          <button class="qty-btn" id="qtyUp" aria-label="Increase">+</button>
        </div>
      </div>

      <div class="panel-block">
        <label class="toggle-row">
          <input type="checkbox" id="allowDupes" />
          <span>Allow repeats</span>
        </label>
      </div>

      <div id="poolCount" class="pool-count">Loading pool…</div>

      <button id="pullBtn" class="pull-btn" disabled>Pull</button>
      <button id="clearBtn" class="clear-btn">Clear filters</button>
    </div>

    <div class="results">
      <div id="resultsEmpty" class="results-empty">
        <div class="results-empty-ball">
          <svg viewBox="0 0 100 100" width="64" height="64">
            <circle cx="50" cy="50" r="44" fill="none" stroke="#2C2F55" stroke-width="4" stroke-dasharray="6 8"/>
          </svg>
        </div>
        <p>Your pulls will land here</p>
      </div>
      <div id="resultsGrid" class="results-grid"></div>
    </div>
  </div>
</div>

<style>
#app {
  --bg: #14162B;
  --panel: #1D2040;
  --panel-border: #2C2F55;
  --card: #23264A;
  --red: #EE1515;
  --gold: #FFCB05;
  --text: #F1F1F6;
  --text-dim: #9497B8;
  font-family: 'Nunito', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: var(--bg);
  color: var(--text);
  padding: 28px 20px 40px;
  border-radius: 18px;
  max-width: 900px;
  margin: 0 auto;
  box-sizing: border-box;
}
#app * { box-sizing: border-box; }

.header {
  display: flex;
  align-items: center;
  gap: 16px;
  margin-bottom: 24px;
}
.header-text h1 {
  margin: 0;
  font-size: 26px;
  font-weight: 800;
  letter-spacing: -0.02em;
}
.header-text p {
  margin: 4px 0 0;
  color: var(--text-dim);
  font-size: 14px;
}

.layout {
  display: grid;
  grid-template-columns: 300px 1fr;
  gap: 20px;
}
@media (max-width: 640px) {
  .layout { grid-template-columns: 1fr; }
}

.panel {
  background: var(--panel);
  border: 1px solid var(--panel-border);
  border-radius: 16px;
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 18px;
  align-self: start;
}
.panel-block { display: flex; flex-direction: column; gap: 10px; }
.panel-label {
  font-size: 13px;
  font-weight: 700;
  color: var(--text-dim);
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 8px;
}
.panel-hint { font-weight: 500; font-size: 11px; color: #6B6E96; }

.sr-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 6px;
}
.sr-chip {
  background: var(--card);
  border: 1px solid var(--panel-border);
  color: var(--text);
  border-radius: 8px;
  padding: 8px 4px;
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
  text-align: center;
  transition: transform 0.08s ease, background 0.15s ease, border-color 0.15s ease;
}
.sr-chip:hover { border-color: var(--gold); }
.sr-chip:active { transform: scale(0.95); }
.sr-chip.active {
  background: var(--red);
  border-color: var(--red);
  color: #fff;
}

.type-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 6px;
}
.type-chip {
  background: var(--card);
  border: 1px solid var(--panel-border);
  color: var(--text-dim);
  border-radius: 8px;
  padding: 7px 4px;
  font-size: 12px;
  font-weight: 700;
  cursor: pointer;
  text-align: center;
  transition: transform 0.08s ease, background 0.15s ease, border-color 0.15s ease, color 0.15s ease;
}
.type-chip:hover { border-color: var(--gold); color: var(--text); }
.type-chip:active { transform: scale(0.95); }
.type-chip.active {
  color: #fff;
  border-color: transparent;
}

.cat-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 6px;
}
.cat-chip {
  background: var(--card);
  border: 1px solid var(--panel-border);
  color: var(--text);
  border-radius: 8px;
  padding: 9px 4px;
  font-size: 12px;
  font-weight: 700;
  cursor: pointer;
  text-align: center;
  transition: transform 0.08s ease, background 0.15s ease, border-color 0.15s ease;
}
.cat-chip:hover { border-color: var(--gold); }
.cat-chip:active { transform: scale(0.95); }
.cat-chip.active {
  background: var(--gold);
  border-color: var(--gold);
  color: #1A1A2E;
}

.qty-row {
  display: flex;
  align-items: center;
  gap: 10px;
}
.qty-btn {
  width: 36px;
  height: 36px;
  border-radius: 8px;
  border: 1px solid var(--panel-border);
  background: var(--card);
  color: var(--text);
  font-size: 18px;
  font-weight: 700;
  cursor: pointer;
  flex-shrink: 0;
}
.qty-btn:hover { border-color: var(--gold); }
#qtyInput {
  flex: 1;
  text-align: center;
  background: var(--card);
  border: 1px solid var(--panel-border);
  color: var(--text);
  border-radius: 8px;
  height: 36px;
  font-size: 15px;
  font-weight: 700;
}
#qtyInput::-webkit-outer-spin-button,
#qtyInput::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
#qtyInput { -moz-appearance: textfield; min-width: 0; }
.qty-row { flex-wrap: nowrap; }

.toggle-row {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 13px;
  color: var(--text-dim);
  cursor: pointer;
}
.toggle-row input { accent-color: var(--red); width: 16px; height: 16px; }

.pool-count {
  font-size: 12px;
  color: var(--text-dim);
  border-top: 1px solid var(--panel-border);
  padding-top: 14px;
}
.pool-count strong { color: var(--gold); }

.pull-btn {
  background: var(--red);
  color: #fff;
  border: none;
  border-radius: 10px;
  padding: 13px;
  font-size: 15px;
  font-weight: 800;
  letter-spacing: 0.02em;
  cursor: pointer;
  transition: filter 0.15s ease, transform 0.06s ease;
}
.pull-btn:hover:not(:disabled) { filter: brightness(1.1); }
.pull-btn:active:not(:disabled) { transform: scale(0.98); }
.pull-btn:disabled { opacity: 0.4; cursor: not-allowed; }

.clear-btn {
  background: transparent;
  color: var(--text-dim);
  border: 1px solid var(--panel-border);
  border-radius: 10px;
  padding: 9px;
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
}
.clear-btn:hover { color: var(--text); border-color: var(--gold); }

.results {
  background: var(--panel);
  border: 1px solid var(--panel-border);
  border-radius: 16px;
  padding: 20px;
  min-height: 260px;
}
.results-empty {
  height: 100%;
  min-height: 220px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 12px;
  color: #565A82;
  font-size: 14px;
}
.results-grid {
  display: none;
  grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
  gap: 12px;
}
.results-grid.show { display: grid; }
.results-empty.hide { display: none; }

.result-card {
  background: var(--card);
  border: 1px solid var(--panel-border);
  border-radius: 12px;
  padding: 14px;
  animation: pop 0.28s ease both;
}
@keyframes pop {
  0% { opacity: 0; transform: translateY(6px) scale(0.96); }
  100% { opacity: 1; transform: translateY(0) scale(1); }
}
.result-name {
  font-weight: 800;
  font-size: 15px;
  margin-bottom: 8px;
}
.result-types { display: flex; gap: 5px; flex-wrap: wrap; margin-bottom: 8px; }
.type-pill {
  font-size: 10px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.03em;
  padding: 3px 8px;
  border-radius: 999px;
  color: #fff;
}
.cat-badge {
  font-size: 10px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.03em;
  padding: 3px 8px;
  border-radius: 999px;
  color: #1A1A2E;
  background: var(--gold);
}
.result-sr {
  font-size: 11px;
  color: var(--text-dim);
  font-weight: 700;
}
.result-sr span { color: var(--gold); }
</style>

      const tierOk = activeTiers.size === 0 || activeTiers.has(p.sr);
      const typeOk = activeTypes.size === 0 || p.type.split("/").some(t => activeTypes.has(t));
      const catOk = activeCats.size === 0 || (p.cat || []).some(c => activeCats.has(c));
      return tierOk && typeOk && catOk;
    });
  }

  function updatePool() {
    const pool = currentPool();
    const qty = Math.max(1, parseInt(qtyInput.value) || 1);
    if (pool.length === 0) {
      poolCountEl.innerHTML = "<strong>0</strong> Pok\u00e9mon match this filter";
      pullBtn.disabled = true;
      pullBtn.textContent = "Pull";
      return;
    }
    const tierLabel = activeTiers.size === 0 ? "all tiers" : (activeTiers.size + " tier" + (activeTiers.size > 1 ? "s" : ""));
    const typeLabel = activeTypes.size === 0 ? "all types" : (activeTypes.size + " type" + (activeTypes.size > 1 ? "s" : ""));
    const catLabel = activeCats.size === 0 ? "all categories" : (activeCats.size + " categor" + (activeCats.size > 1 ? "ies" : "y"));
    poolCountEl.innerHTML = "<strong>" + pool.length + "</strong> Pok\u00e9mon in pool \u00b7 " + tierLabel + " \u00b7 " + typeLabel + " \u00b7 " + catLabel;
    pullBtn.disabled = false;
    const capped = !allowDupes.checked && qty > pool.length;
    pullBtn.textContent = capped ? ("Pull " + pool.length + " (all available)") : ("Pull " + qty);
  }

  function pickRandom(pool, qty, dupes) {
    if (dupes) {
      const out = [];
      for (let i = 0; i < qty; i++) out.push(pool[Math.floor(Math.random() * pool.length)]);
      return out;
    }
    const copy = pool.slice();
    for (let i = copy.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [copy[i], copy[j]] = [copy[j], copy[i]];
    }
    return copy.slice(0, qty);
  }

  function renderResults(picks) {
    resultsGrid.innerHTML = "";
    resultsEmpty.classList.add("hide");
    resultsGrid.classList.add("show");
    picks.forEach((p, idx) => {
      const card = document.createElement("div");
      card.className = "result-card";
      card.style.animationDelay = (idx * 0.04) + "s";
      const types = p.type.split("/");
      const catBadges = (p.cat || []).map(c => {
        const label = { starter: "Starter", legendary: "Legendary", mythical: "Mythical", pseudo: "Pseudo-Legendary" }[c] || c;
        return '<span class="cat-badge">' + label + '</span>';
      }).join("");
      card.innerHTML =
        '<div class="result-name">' + p.name + '</div>' +
        '<div class="result-types">' + types.map(t =>
          '<span class="type-pill" style="background:' + (TYPE_COLORS[t] || "#5A5D82") + '">' + t + '</span>'
        ).join("") + catBadges + '</div>' +
        '<div class="result-sr">Tier <span>' + p.sr + '</span></div>';
      resultsGrid.appendChild(card);
    });
  }

  document.getElementById("clearBtn").addEventListener("click", () => {
    activeTiers.clear();
    activeTypes.clear();
    activeCats.clear();
    document.querySelectorAll(".sr-chip.active").forEach(c => c.classList.remove("active"));
    document.querySelectorAll(".type-chip.active").forEach(c => { c.classList.remove("active"); c.style.background = ""; });
    document.querySelectorAll(".cat-chip.active").forEach(c => c.classList.remove("active"));
    updatePool();
  });

  pullBtn.addEventListener("click", () => {
    const pool = currentPool();
    if (pool.length === 0) return;
    const qty = Math.max(1, parseInt(qtyInput.value) || 1);
    const dupes = allowDupes.checked;
    const effectiveQty = dupes ? qty : Math.min(qty, pool.length);
    const picks = pickRandom(pool, effectiveQty, dupes);
    renderResults(picks);
  });

  updatePool();
})();
</script>
</body>
</html>
